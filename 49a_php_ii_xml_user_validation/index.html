<!DOCTYPE html>
<!--
  Question 49 (a)(ii): Modify the above program (49 (a)(i): a user validation web application,
  where the user submits the login name and password to the server; if they match the stored
  data a successful login page is returned, otherwise a failure message is shown) to use an
  XML file instead of database.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login (XML)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; }
        .box { width: 320px; margin: 60px auto; padding: 20px 25px; background: #fff;
               border: 1px solid #ccc; border-radius: 6px; }
        h2 { text-align: center; margin-top: 0; }
        label { display: block; margin-top: 10px; }
        input[type=text], input[type=password] { width: 100%; padding: 6px; box-sizing: border-box; }
        input[type=submit] { margin-top: 15px; width: 100%; padding: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>User Login (XML)</h2>
        <form action="login.php" method="post">
            <label for="username">Login Name</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
